<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%" style="background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%);">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D1D5DB" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Silhouette / Graphic -->
  <circle cx="200" cy="200" r="70" fill="url(#avatarGrad)" opacity="0.15" />
  <path d="M 130 380 C 130 280, 270 280, 270 380 Z" fill="url(#avatarGrad)" opacity="0.15" />
  
  <!-- Decorative Abstract Accent -->
  <rect x="50" y="50" width="300" height="400" rx="16" fill="none" stroke="url(#avatarGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Icon Symbol -->
  <g transform="translate(188, 188)">
    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z" fill="url(#avatarGrad)" />
  </g>

  <!-- Instructional Text -->
  <rect x="60" y="320" width="280" height="60" rx="8" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
  <text x="200" y="345" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="600" fill="#1F2937" text-anchor="middle">Profile Photo Placeholder</text>
  <text x="200" y="362" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="10" font-weight="400" fill="#6B7280" text-anchor="middle">Replace with assets/profile.jpg (4:5)</text>
</svg>
